<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAS – Admin & Revenue System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070b0f;--surface:#0d1117;--surface2:#111820;--border:#1a2633;--accent:#00ff9f;--accent-dim:#00885a;--blue:#7dd3fc;--amber:#fbbf24;--purple:#a78bfa;--text:#cdd6f4;--muted:#5b6b8a;--dim:#131c27;--red:#f87171}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono','Courier New',monospace;font-size:14px;line-height:1.7;min-height:100vh;overflow-x:hidden}
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:9999}
  #starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px 80px;position:relative;z-index:1}
  header{padding:48px 0 32px;border-bottom:1px solid var(--border);margin-bottom:32px}
  .header-meta{font-size:.72rem;color:var(--accent-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
  header h1{font-family:'VT323',monospace;font-size:2.8rem;color:var(--text);letter-spacing:4px;text-transform:uppercase;line-height:1;margin-bottom:10px}
  header h1 .hl{color:var(--accent)}
  header p{font-size:.78rem;color:var(--muted);letter-spacing:1px}
  header p a{color:var(--accent-dim);text-decoration:none}
  header p a:hover{color:var(--accent)}
  .stats{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:24px}
  .stat-pill{background:var(--surface);border:1px solid var(--border);padding:4px 14px;font-size:.72rem;color:var(--muted);letter-spacing:1px}
  .stat-pill span{color:var(--accent)}
  .progress-wrap{margin-bottom:28px}
  .progress-text{font-size:.72rem;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
  .progress-bar-track{height:2px;background:var(--border);max-width:400px}
  .progress-bar{height:100%;background:var(--accent);transition:width .3s;width:0%}
  .filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:36px}
  .filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 14px;font-family:'Share Tech Mono',monospace;font-size:.72rem;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .filter-btn::before{content:'[';color:var(--dim);margin-right:2px}
  .filter-btn::after{content:']';color:var(--dim);margin-left:2px}
  .filter-btn:hover{border-color:var(--accent-dim);color:var(--text)}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
  .filter-btn.active::before,.filter-btn.active::after{color:var(--accent-dim)}
  .filter-btn.pyq-filter.active{background:var(--red);border-color:var(--red);color:var(--bg)}
  .filter-btn.prob-filter.active{background:var(--amber);border-color:var(--amber);color:var(--bg)}
  .topic-divider{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:24px 0 8px}
  .topic-divider h2{font-family:'VT323',monospace;font-size:1.2rem;color:var(--accent);letter-spacing:3px;text-transform:uppercase;white-space:nowrap;opacity:.7}
  .topic-divider hr{flex:1;border:none;border-top:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px;max-width:1100px}
  .card-wrap{perspective:1000px;height:220px;cursor:pointer}
  .card-wrap.tall{height:280px}
  .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .card-wrap.flipped .card-inner{transform:rotateY(180deg)}
  .card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;padding:18px 20px;display:flex;flex-direction:column;border:1px solid var(--border);overflow:hidden;background:var(--surface);transition:border-color .2s}
  .card-front::before,.card-back::before{content:'';position:absolute;top:0;left:0;width:2px;height:0%;background:var(--accent);transition:height .3s ease}
  .card-wrap:hover .card-front::before,.card-wrap:hover .card-back::before{height:100%}
  .card-wrap:hover .card-front,.card-wrap:hover .card-back{border-color:var(--accent-dim)}
  .card-back{transform:rotateY(180deg);background:var(--surface2);justify-content:flex-start;overflow-y:auto}
  .card-header{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:.62rem;padding:1px 8px;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--border);color:var(--muted)}
  .badge-pyq{border-color:rgba(241,113,113,.4);color:var(--red)}
  .badge-prob{border-color:rgba(251,191,36,.4);color:var(--amber)}
  .question{font-size:.88rem;line-height:1.6;color:var(--text);flex:1;display:flex;align-items:center;letter-spacing:.3px}
  .flip-hint{font-size:.65rem;color:var(--muted);text-align:right;margin-top:8px;letter-spacing:1px}
  .answer-label{font-size:.65rem;color:var(--accent-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
  .answer{font-size:.82rem;line-height:1.7;color:var(--muted)}
  .answer strong{color:var(--amber)}
  .answer .point{display:flex;gap:6px;margin-bottom:3px}
  .answer .point::before{content:"›";color:var(--accent-dim);flex-shrink:0}
  .card-num{position:absolute;bottom:8px;right:12px;font-size:.6rem;color:var(--border);letter-spacing:1px}
  #scrollBtn{position:fixed;bottom:28px;right:28px;width:38px;height:38px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'Share Tech Mono',monospace;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:500;transition:all .2s;font-size:1rem}
  #scrollBtn:hover{border-color:var(--accent-dim);color:var(--accent)}
  #scrollBtn.visible{display:flex}
  @media(max-width:680px){.wrap{padding:0 16px 60px}header h1{font-size:2rem;letter-spacing:2px}.grid{grid-template-columns:1fr}.card-wrap,.card-wrap.tall{height:auto;min-height:220px}}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="wrap">
<header>
  <div class="header-meta">&gt; ras_prep // medieval_history // admin_revenue_system</div>
  <h1>Admin &<br><span class="hl">Revenue System</span></h1>
  <p>Medieval History of Rajasthan &nbsp;·&nbsp; Click any card to flip &nbsp;·&nbsp;
     <a href="../index.html">← flashcard home</a> &nbsp;·&nbsp;
     <a href="../../index.html">← portfolio</a></p>
</header>
<div class="stats">
  <div class="stat-pill">total <span id="total-count">0</span></div>
  <div class="stat-pill">pyq <span id="pyq-count">0</span></div>
  <div class="stat-pill">high-prob <span id="prob-count">0</span></div>
  <div class="stat-pill">studied <span id="studied-count">0</span></div>
</div>
<div class="progress-wrap">
  <div class="progress-text" id="progress-text">&gt; 0 / 0 studied</div>
  <div class="progress-bar-track"><div class="progress-bar" id="progress-bar"></div></div>
</div>
<div class="filters">
  
<button class="filter-btn active" onclick="filterCards(this,'all')">All</button>
<button class="filter-btn pyq-filter" onclick="filterCards(this,'pyq')">PYQ</button>
<button class="filter-btn prob-filter" onclick="filterCards(this,'prob')">High Prob</button>
<button class="filter-btn" onclick="filterCards(this,'feudal')">Feudal System</button>
<button class="filter-btn" onclick="filterCards(this,'taxes')">Taxes</button>
<button class="filter-btn" onclick="filterCards(this,'jagir')">Jagir Types</button>
<button class="filter-btn" onclick="filterCards(this,'grades')">Feudal Grades</button>
<button class="filter-btn" onclick="filterCards(this,'officers')">Admin Officers</button>
<button class="filter-btn" onclick="filterCards(this,'revenue')">Land Revenue</button>

</div>
<div class="grid" id="card-grid"></div>
</div>
<button id="scrollBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const cards=[
{id:1,topic:'feudal',topicLabel:'Feudal System – Basics',q:'What is the Jagir/Feudal system of medieval Rajasthan? James Tod\'s comparison.',a:`<div class="point"><span>One brother became king; gave land (<strong>Jagir/Thikana</strong>) to other brothers = <strong>Feudal Lords</strong></span></div><div class="point"><span>Hereditary system. State = <strong>collective heritage</strong>, not personal property of king</span></div><div class="point"><span>James Tod: Europe = Master & Servant relation; Rajasthan = like a <strong>Tent</strong>; king = <strong>"First among Equals"</strong></span></div><div class="point"><span>Based on Brotherhood; during Mughal rule hierarchy was established but basic structure remained</span></div>`,pyq:true,prob:false},
{id:2,topic:'taxes',topicLabel:'Taxes from Feudal Lords to King',q:'Name and explain 6 taxes that feudal lords paid to the king.',a:`<div class="point"><span><strong>Rekh</strong>: land revenue; Patta Rekh=estimated; Bharatu Rekh=actual. Amar Singh II of Mewar made it systematic = <strong>Amar Shahi Rekh</strong></span></div><div class="point"><span><strong>Succession Tax</strong>: new feudal lord gave tax. Names: Najarana (Mewar), Hukmanama Peshkashi (Marwar). Exception: <strong>Jaisalmer</strong> (no succession tax)</span></div><div class="point"><span><strong>Najarana</strong>: on first wedding of Prince</span></div><div class="point"><span><strong>Nayaut Tax</strong>: on wedding of princess</span></div><div class="point"><span><strong>Ganeem Barad</strong>: during war</span></div><div class="point"><span><strong>Chakari</strong>: services to king (no money). Exception: <strong>Jaisalmer</strong> (received money for Chakari)</span></div>`,pyq:true,prob:false},
{id:3,topic:'taxes',topicLabel:'Special Rights of Feudal Lords – Tajeem',q:'What were the special rights (Tajeem) given to feudal lords at king\'s court?',a:`<div class="point"><span><strong>Tajeem</strong>: King welcomed feudal lord by giving standing position</span></div><div class="point"><span><strong>Ekewadi</strong>: standing on entry only</span></div><div class="point"><span><strong>Dovari</strong>: standing on both entry & exit</span></div><div class="point"><span><strong>Banh Pasav</strong>: king patted on shoulders</span></div><div class="point"><span><strong>Hath Kurab</strong>: king patted shoulders & touched hand to heart</span></div>`,pyq:true,prob:false},
{id:4,topic:'jagir',topicLabel:'Types of Jagir',q:'Name all 4 types of Jagir and their characteristics.',a:`<div class="point"><span><strong>Samant Jagir</strong>: hereditary; king allotted to his brothers</span></div><div class="point"><span><strong>Hukumat Jagir</strong>: for administrative officers; <strong>non-hereditary</strong></span></div><div class="point"><span><strong>Bhaum Jagir</strong>: for military services; both hereditary & non-hereditary</span></div><div class="point"><span><strong>Sasan (Mafi Jagir)</strong>: tax-free religious grant. Akbar donated 18 villages to Ajmer Dargah; Jagat Singh II donated 4 villages; Ajit Singh gave land grant too</span></div>`,pyq:true,prob:false},
{id:5,topic:'grades',topicLabel:'Grades of Feudal Lords',q:'How many grades of feudal lords were there in Mewar, Marwar, Bikaner, and Jaisalmer?',a:`<div class="point"><span><strong>Mewar</strong>: 3 grades. 1st = 16 (Umarao); 2nd = 32; 3rd = 100+ (Gol ke samant). Salumbar = most prominent. Devgarh = last 1st grade Thikana</span></div><div class="point"><span><strong>Marwar</strong>: 4 grades — Rajavi, Sirdar, Ginayat, Mutsaddi</span></div><div class="point"><span><strong>Bikaner</strong>: 3 grades — descendants of Bika; other Rathores; pre-Bika ruling class</span></div><div class="point"><span><strong>Jaisalmer</strong>: 2 grades (by Harraj) — Jivani, Davi</span></div><div class="point"><span><strong>Amber</strong>: Prithviraj appointed 12 prominent = <strong>'Baarh Kotadi System'</strong></span></div><div class="point"><span><strong>Kota</strong>: 30 prominent; 2 grades — Deshthi (inside Kota), Hajurathi (go out with king)</span></div>`,pyq:true,prob:false},
{id:6,topic:'officers',topicLabel:'Administrative Officers – 1 to 5',q:'King, Pradhan, Deewan, Bakshi – roles and different names in different states.',a:`<div class="point"><span><strong>King</strong>: supreme but not monarch/autocrat; ruled with Purohit, Prince & Feudal lords</span></div><div class="point"><span><strong>Pradhan</strong>: advised in political & military affairs. Names: Mewar/Marwar/Jaisalmer = Pardhan; Jaipur = Deewan/Faujdar; Kota/Bundi = Mukhtyar; Bikaner/Bharatpur = Musahib</span></div><div class="point"><span><strong>Deewan</strong>: advised in finance & revenue; 'Desh Deewan' in king's absence</span></div><div class="point"><span><strong>Bakshi</strong>: handled recruitment, discipline & training</span></div><div class="point"><span><strong>Nayab Bakshi</strong>: military & fort expenditures; managed Rekh</span></div>`,pyq:true,prob:false},
{id:7,topic:'officers',topicLabel:'Administrative Officers – 6 to 10',q:'Sikdar, Meer Sama, Vakil, Naimettik, Meer Munshi – what did each do?',a:`<div class="point"><span><strong>Sikdar</strong>: managed law & order of town; non-military expenditure; Mughal equivalent = <strong>Kotwal</strong></span></div><div class="point"><span><strong>Meer Sama</strong>: supplied essential goods; controlled govt. industries; later promoted as Deewan</span></div><div class="point"><span><strong>Vakil</strong>: representative of Thikana in capital</span></div><div class="point"><span><strong>Naimettik</strong>: Royal Astrologer</span></div><div class="point"><span><strong>Meer Munshi</strong>: wrote letters from king's side. During Pratihar rule: admin officers = <strong>'Rajpurush'</strong></span></div>`,pyq:false,prob:true},
{id:8,topic:'revenue',topicLabel:'Land Revenue – Types & Measurement',q:'Name all 8 types of land revenue measurement in medieval Rajasthan.',a:`<div class="point"><span><strong>Lata-Kunta</strong>: estimation of crop</span></div><div class="point"><span><strong>Dori</strong>: measurement of land</span></div><div class="point"><span><strong>Mukata</strong>: revenue of entire village decided</span></div><div class="point"><span><strong>Ghughari</strong>: in ratio of seeds</span></div><div class="point"><span><strong>Jajam</strong>: on sale-purchase of land</span></div><div class="point"><span><strong>Singoti</strong>: on sale-purchase of cattle</span></div><div class="point"><span><strong>Daan</strong>: on trade of goods from one place to another</span></div><div class="point"><span><strong>Sayar</strong>: transit/transition fees</span></div>`,pyq:true,prob:false},
{id:9,topic:'revenue',topicLabel:'Land Revenue – Farmer Types & Land Types',q:'Bapidar vs Non-Bapidar farmers. What are the two types of agricultural land?',a:`<div class="point"><span><strong>Bapidar</strong>: owned land; given <strong>Patta/Dakhila</strong>; could dig well & collect wood</span></div><div class="point"><span><strong>Non-Bapidar (Shikami)</strong>: no own land; cultivated others' land</span></div><div class="point"><span>Agricultural land types: <strong>Unnav/Piwal</strong> (artificial irrigation) vs <strong>Barrani</strong> (rain-fed)</span></div><div class="point"><span>Grazing land = public land; collective rights; king cannot convert to Khalsa</span></div><div class="point"><span>3 factors for measurement: Productivity, Market price, <strong>Caste</strong> (Rajput/Brahmin = less tax)</span></div>`,pyq:false,prob:true},
{id:10,topic:'revenue',topicLabel:'Land Revenue – Other Details',q:'Revenue names in different forms. Who were the revenue officers?',a:`<div class="point"><span>Revenue names: <strong>Bhog/Bhoj/Lagan/Hasil</strong> (food grain); <strong>Hiranya</strong> (cash)</span></div><div class="point"><span>Revenue officers: <strong>State Patwari</strong> at state level; <strong>Village Choudhary/Patel</strong> at village level</span></div><div class="point"><span>During famine: if farmer left, king could NOT convert his land to Khalsa</span></div>`,pyq:false,prob:true},
{id:11,topic:'revenue',topicLabel:'Judicial Administration',q:'Judicial system in medieval Rajasthan – who handled what?',a:`<div class="point"><span>King = supreme judiciary officer; handled major crimes & death penalty</span></div><div class="point"><span><strong>Hakim</strong> = judiciary at Khalsa region</span></div><div class="point"><span>Feudal lords did justice at Jagirs</span></div><div class="point"><span>Small cases = <strong>Gram Panchayat & Jatiya Panchayat (Caste Panchayat)</strong></span></div><div class="point"><span>Justice based on Dharmashastra; crime = against person not state; no written records; punishment simple; justice cheap & immediate</span></div><div class="point"><span>Some feudal lords had <strong>right of asylum</strong> → sometimes big criminals protected</span></div>`,pyq:false,prob:true}
];
let studied=new Set();
function renderCards(filter){
  const grid=document.getElementById('card-grid');grid.innerHTML='';
  const f=filter==='all'?cards:filter==='pyq'?cards.filter(c=>c.pyq):filter==='prob'?cards.filter(c=>c.prob):cards.filter(c=>c.topic===filter);
  if(!f.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">No cards.</div>';return}
  let last='';
  f.forEach(card=>{
    if(card.topicLabel!==last){const d=document.createElement('div');d.className='topic-divider';d.innerHTML=`<h2>${card.topicLabel}</h2><hr>`;grid.appendChild(d);last=card.topicLabel}
    const tall=card.a.length>400;const wrap=document.createElement('div');
    wrap.className=`card-wrap${tall?' tall':''}${studied.has(card.id)?' flipped':''}`;
    wrap.onclick=function(){this.classList.toggle('flipped');studied[this.classList.contains('flipped')?'add':'delete'](card.id);updateStats()};
    const b=`<div class="card-header"><span class="badge">${card.topicLabel}</span>${card.pyq?'<span class="badge badge-pyq">PYQ</span>':''}${card.prob?'<span class="badge badge-prob">HIGH-PROB</span>':''}</div>`;
    wrap.innerHTML=`<div class="card-inner"><div class="card-front">${b}<div class="question">${card.q}</div><div class="flip-hint">click to reveal ↓</div><span class="card-num">#${card.id}</span></div><div class="card-back">${b}<div class="answer-label">&gt; answer</div><div class="answer">${card.a}</div><span class="card-num">#${card.id}</span></div></div>`;
    grid.appendChild(wrap);
  });updateStats();
}
function filterCards(btn,filter){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCards(filter)}
function updateStats(){const t=cards.length,p=cards.filter(c=>c.pyq).length,pr=cards.filter(c=>c.prob).length;document.getElementById('total-count').textContent=t;document.getElementById('pyq-count').textContent=p;document.getElementById('prob-count').textContent=pr;document.getElementById('studied-count').textContent=studied.size;document.getElementById('progress-text').textContent=`> ${studied.size} / ${t} studied`;document.getElementById('progress-bar').style.width=(studied.size/t*100)+'%'}
window.addEventListener('scroll',()=>document.getElementById('scrollBtn').classList.toggle('visible',window.scrollY>300));
renderCards('all');
(function(){const c=document.getElementById('starfield'),ctx=c.getContext('2d');let W,H,stars=[],frame=0;function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}function init(){stars=[];const n=Math.min(180,Math.floor(W*H/8000));for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.1,speed:Math.random()*.2+.03,opacity:Math.random()*.5+.08,twinkle:Math.random()*Math.PI*2})}function draw(){ctx.clearRect(0,0,W,H);frame+=.008;stars.forEach(s=>{const a=s.opacity*(.75+.25*Math.sin(frame+s.twinkle));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(205,214,244,${a})`;ctx.fill();s.y+=s.speed;if(s.y>H+2){s.y=-2;s.x=Math.random()*W}});requestAnimationFrame(draw)}resize();init();draw();window.addEventListener('resize',()=>{resize();init()})})();
</script>
</body>
</html>
