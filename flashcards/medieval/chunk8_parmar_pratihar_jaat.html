<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAS – Parmar, Pratihar & Jaat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070b0f;--surface:#0d1117;--surface2:#111820;--border:#1a2633;--accent:#00ff9f;--accent-dim:#00885a;--blue:#7dd3fc;--amber:#fbbf24;--purple:#a78bfa;--text:#cdd6f4;--muted:#5b6b8a;--dim:#131c27;--red:#f87171}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono','Courier New',monospace;font-size:14px;line-height:1.7;min-height:100vh;overflow-x:hidden}
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:9999}
  #starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px 80px;position:relative;z-index:1}
  header{padding:48px 0 32px;border-bottom:1px solid var(--border);margin-bottom:32px}
  .header-meta{font-size:.72rem;color:var(--accent-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
  header h1{font-family:'VT323',monospace;font-size:2.8rem;color:var(--text);letter-spacing:4px;text-transform:uppercase;line-height:1;margin-bottom:10px}
  header h1 .hl{color:var(--accent)}
  header p{font-size:.78rem;color:var(--muted);letter-spacing:1px}
  header p a{color:var(--accent-dim);text-decoration:none}
  header p a:hover{color:var(--accent)}
  .stats{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:24px}
  .stat-pill{background:var(--surface);border:1px solid var(--border);padding:4px 14px;font-size:.72rem;color:var(--muted);letter-spacing:1px}
  .stat-pill span{color:var(--accent)}
  .progress-wrap{margin-bottom:28px}
  .progress-text{font-size:.72rem;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
  .progress-bar-track{height:2px;background:var(--border);max-width:400px}
  .progress-bar{height:100%;background:var(--accent);transition:width .3s;width:0%}
  .filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:36px}
  .filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 14px;font-family:'Share Tech Mono',monospace;font-size:.72rem;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .filter-btn::before{content:'[';color:var(--dim);margin-right:2px}
  .filter-btn::after{content:']';color:var(--dim);margin-left:2px}
  .filter-btn:hover{border-color:var(--accent-dim);color:var(--text)}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
  .filter-btn.active::before,.filter-btn.active::after{color:var(--accent-dim)}
  .filter-btn.pyq-filter.active{background:var(--red);border-color:var(--red);color:var(--bg)}
  .filter-btn.prob-filter.active{background:var(--amber);border-color:var(--amber);color:var(--bg)}
  .topic-divider{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:24px 0 8px}
  .topic-divider h2{font-family:'VT323',monospace;font-size:1.2rem;color:var(--accent);letter-spacing:3px;text-transform:uppercase;white-space:nowrap;opacity:.7}
  .topic-divider hr{flex:1;border:none;border-top:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px;max-width:1100px}
  .card-wrap{perspective:1000px;height:220px;cursor:pointer}
  .card-wrap.tall{height:280px}
  .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .card-wrap.flipped .card-inner{transform:rotateY(180deg)}
  .card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;padding:18px 20px;display:flex;flex-direction:column;border:1px solid var(--border);overflow:hidden;background:var(--surface);transition:border-color .2s}
  .card-front::before,.card-back::before{content:'';position:absolute;top:0;left:0;width:2px;height:0%;background:var(--accent);transition:height .3s ease}
  .card-wrap:hover .card-front::before,.card-wrap:hover .card-back::before{height:100%}
  .card-wrap:hover .card-front,.card-wrap:hover .card-back{border-color:var(--accent-dim)}
  .card-back{transform:rotateY(180deg);background:var(--surface2);justify-content:flex-start;overflow-y:auto}
  .card-header{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:.62rem;padding:1px 8px;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--border);color:var(--muted)}
  .badge-pyq{border-color:rgba(241,113,113,.4);color:var(--red)}
  .badge-prob{border-color:rgba(251,191,36,.4);color:var(--amber)}
  .question{font-size:.88rem;line-height:1.6;color:var(--text);flex:1;display:flex;align-items:center;letter-spacing:.3px}
  .flip-hint{font-size:.65rem;color:var(--muted);text-align:right;margin-top:8px;letter-spacing:1px}
  .answer-label{font-size:.65rem;color:var(--accent-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
  .answer{font-size:.82rem;line-height:1.7;color:var(--muted)}
  .answer strong{color:var(--amber)}
  .answer .point{display:flex;gap:6px;margin-bottom:3px}
  .answer .point::before{content:"›";color:var(--accent-dim);flex-shrink:0}
  .card-num{position:absolute;bottom:8px;right:12px;font-size:.6rem;color:var(--border);letter-spacing:1px}
  #scrollBtn{position:fixed;bottom:28px;right:28px;width:38px;height:38px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'Share Tech Mono',monospace;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:500;transition:all .2s;font-size:1rem}
  #scrollBtn:hover{border-color:var(--accent-dim);color:var(--accent)}
  #scrollBtn.visible{display:flex}
  @media(max-width:680px){.wrap{padding:0 16px 60px}header h1{font-size:2rem;letter-spacing:2px}.grid{grid-template-columns:1fr}.card-wrap,.card-wrap.tall{height:auto;min-height:220px}}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="wrap">
<header>
  <div class="header-meta">&gt; ras_prep // medieval_history // parmar_pratihar_jaat</div>
  <h1>Parmar, Pratihar<br><span class="hl">& Jaat</span></h1>
  <p>Medieval History of Rajasthan &nbsp;·&nbsp; Click any card to flip &nbsp;·&nbsp;
     <a href="../index.html">← flashcard home</a> &nbsp;·&nbsp;
     <a href="../../index.html">← portfolio</a></p>
</header>
<div class="stats">
  <div class="stat-pill">total <span id="total-count">0</span></div>
  <div class="stat-pill">pyq <span id="pyq-count">0</span></div>
  <div class="stat-pill">high-prob <span id="prob-count">0</span></div>
  <div class="stat-pill">studied <span id="studied-count">0</span></div>
</div>
<div class="progress-wrap">
  <div class="progress-text" id="progress-text">&gt; 0 / 0 studied</div>
  <div class="progress-bar-track"><div class="progress-bar" id="progress-bar"></div></div>
</div>
<div class="filters">
  
<button class="filter-btn active" onclick="filterCards(this,'all')">All</button>
<button class="filter-btn pyq-filter" onclick="filterCards(this,'pyq')">PYQ</button>
<button class="filter-btn prob-filter" onclick="filterCards(this,'prob')">High Prob</button>
<button class="filter-btn" onclick="filterCards(this,'abu')">Abu (Parmar)</button>
<button class="filter-btn" onclick="filterCards(this,'malwa')">Malwa (Parmar)</button>
<button class="filter-btn" onclick="filterCards(this,'pratihar')">Pratihar</button>
<button class="filter-btn" onclick="filterCards(this,'jaisal')">Jaisalmer</button>
<button class="filter-btn" onclick="filterCards(this,'karauli')">Karauli</button>
<button class="filter-btn" onclick="filterCards(this,'jaat')">Jaat Dynasty</button>

</div>
<div class="grid" id="card-grid"></div>
</div>
<button id="scrollBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const cards=[
{id:1,topic:'abu',topicLabel:'Abu – Parmar Dynasty',q:'Vimal Shah and the Adinath Temple at Abu – key facts.',a:`<div class="point"><span>Dhandhuk: Bheem I Chalukya attacked; Bhoj Parmar gave shelter at Chittor</span></div><div class="point"><span>Bheem I appointed <strong>Vimal Shah</strong> as magistrate of Abu; he built <strong>Adinath Temple (Vimal Vasahi)</strong></span></div><div class="point"><span>James Tod: <strong>"Most beautiful building of India after the Taj Mahal"</strong></span></div><div class="point"><span>Dharni Varah divided state among 9 brothers → <strong>'Navkoti Marwar'</strong></span></div>`,pyq:true,prob:false},
{id:2,topic:'abu',topicLabel:'Abu – Battle of Kayandra (1178)',q:'Battle of Kayandra (1178) – participants and outcome.',a:`<div class="point"><span>Mohammad Gauri vs <strong>Mulraj II</strong> (Guardian: Naika Devi) + Kelhan (Nadol) + Kirtipal (Jalore) + <strong>Dharavarsh (Abu)</strong></span></div><div class="point"><span>→ <strong>Mohammad Gauri DEFEATED</strong></span></div><div class="point"><span>Dharavarsh could pierce 3 buffaloes with one arrow</span></div><div class="point"><span>Someshwar (court scholar) wrote <em>'Kirti Kaumudi'</em></span></div>`,pyq:true,prob:false},
{id:3,topic:'abu',topicLabel:'Abu – Loonvasahi Temple',q:'Nemimath Temple (Loonvasahi) at Abu – who built it?',a:`<div class="point"><span>Built by <strong>Vastupal & Tejpal</strong></span></div><div class="point"><span>Located at Abu; also known as <strong>'Loonvasahi'</strong> and <strong>'Temple of Devrani-Jethani'</strong></span></div><div class="point"><span>Som Singh (son of Dharavarsh) was the ruling king at that time</span></div>`,pyq:false,prob:true},
{id:4,topic:'malwa',topicLabel:'Malwa – Bhoj Parmar',q:'Bhoj Parmar – what did he build and what is the Gyanpeeth Award connection?',a:`<div class="point"><span>Built <strong>Tribhuvan Narayan Temple</strong> in Chittor (later renamed Samidheshwar Temple)</span></div><div class="point"><span>Built <strong>Bhojpur lake</strong>; built <strong>Saraswatikanthabharan Sanskrit school</strong> in Dhara</span></div><div class="point"><span>School had idol of Saraswati = <strong>symbol of Gyanpeeth Award</strong> today</span></div><div class="point"><span>Muslim invaders broke school → built <strong>Kamalmoula Mosque</strong></span></div><div class="point"><span>Wrote Shringaramanjari Katha (Prakrit) & Kurmashtak (Sanskrit)</span></div>`,pyq:true,prob:false},
{id:5,topic:'malwa',topicLabel:'Malwa – Munj Parmar',q:'Munj Parmar – achievements and court scholars.',a:`<div class="point"><span>Attacked Mewar during Shakti Kumar; destroyed Ahar; captured Chittor</span></div><div class="point"><span>Killed fighting Chalukya king Tailap of Karnataka</span></div><div class="point"><span>Court scholars: Halayudh (Abhidhan Ratnamala), <strong>Padmagupta (Navasahasanka Charita)</strong>, Dhananjaya (Dashrupaka), Dhanapal (Tilkamanjari)</span></div><div class="point"><span>Titles: Vakpatiraj, Prithvivallabh, <strong>Kavi Vrish</strong></span></div>`,pyq:false,prob:true},
{id:6,topic:'pratihar',topicLabel:'Pratihar Dynasty – Mandore',q:'Mandore Pratihar dynasty – Harish Chandra, Bauk Eulogy, and Ghatiyala inscriptions.',a:`<div class="point"><span><strong>Mandore = origin place</strong> of Pratihars; Harish Chandra = first ancestor. Title: <strong>'Rohliddhi'</strong></span></div><div class="point"><span>Four sons captured Mandore: Bhogbhatt, Kakka, Rajjil, Dadda</span></div><div class="point"><span><strong>Bauk Eulogy (837 AD)</strong> at Vishnu Temple of Mandore = prominent source about Pratihars of Mandore</span></div><div class="point"><span><strong>Kakkuka: 2 inscriptions at Ghatiyala (861 AD)</strong>: (A) Mata ki Sal (Jain temple, Prakrit); (B) Khakhu Deval = Ganpati Pillar Inscription (Sanskrit, writer Matri Ravi)</span></div>`,pyq:true,prob:false},
{id:7,topic:'jaisal',topicLabel:'Jaisalmer – Bhatti Dynasty',q:'Jaisalmer Fort – who founded it, when, and what are its unique features?',a:`<div class="point"><span><strong>Jaisal (1155 AD)</strong>: founded Jaisalmer; started fort construction. Shaliwahan completed it (1187 AD)</span></div><div class="point"><span>Built with <strong>yellow stones</strong> → <strong>Golden Fort (Sonargarh)</strong></span></div><div class="point"><span><strong>No lime used</strong> in construction</span></div><div class="point"><span>Satyajit Ray made film <strong>'Sonar Kila'</strong> on this fort</span></div><div class="point"><span>Bhattis = <strong>'Chhatrala Yadavpati'</strong>; guard north border = <strong>'Uttar Bhadd Kinwar'</strong></span></div>`,pyq:true,prob:false},
{id:8,topic:'jaisal',topicLabel:'Jaisalmer – Sakas',q:'Three Sakas of Jaisalmer – when and under whom?',a:`<div class="point"><span><strong>1st Saka</strong>: Allauddin Khilji attacked; under <strong>Mulraj I</strong></span></div><div class="point"><span><strong>2nd Saka</strong>: Firoz Tughlak attacked; under <strong>Durjansal</strong></span></div><div class="point"><span><strong>Half Saka (1550)</strong>: Amir Ali of Kandhar attacked under <strong>Loon Karan Bhatti</strong>; Kesariya happened but no Johar → <strong>Half Saka</strong></span></div>`,pyq:true,prob:false},
{id:9,topic:'jaisal',topicLabel:'Jaisalmer – Sagarmal Gopa',q:'Sagarmal Gopa – who was he and what happened to him?',a:`<div class="point"><span>Opposed monarchy & British rule; burnt alive in jail on <strong>4 April 1946</strong></span></div><div class="point"><span>Books: <em>Azadi ke Deewane</em>, <em>Jaisalmer ka Gunda Raj</em>, <em>Raghunath Singh ka Mukadma</em></span></div><div class="point"><span>Both Jaisalmer & Hyderabad banned his entry</span></div><div class="point"><span>Inquiry commission: <strong>Gopal Swaroop Pathak Commission</strong></span></div><div class="point"><span>Jawahar Singh built <strong>Mohangarh Fort</strong> = <strong>last fort of India</strong></span></div>`,pyq:false,prob:true},
{id:10,topic:'karauli',topicLabel:'Karauli – Yadu Dynasty',q:'Karauli history – who founded it and Madan Pal\'s key contributions.',a:`<div class="point"><span>Jadaun branch of Yadu dynasty. Yaduvanshis = descendants of Lord Krishna</span></div><div class="point"><span><strong>Arjunpal (1348)</strong>: founded Karauli (earlier Kalyanpur)</span></div><div class="point"><span><strong>Gopal Pal</strong>: participated in Hurada Conference; built <strong>Madan Mohan Temple</strong> at Karauli (Gaudiya sect)</span></div><div class="point"><span><strong>Madan Pal</strong>: liberated Kota's Ram Singh II (1857); 1865: invited Swami Dayanand Saraswati = <strong>first visit to Rajasthan</strong>; British gave <strong>17 cannon salute</strong></span></div>`,pyq:true,prob:false},
{id:11,topic:'jaat',topicLabel:'Jaat Dynasty – Bharatpur',q:'Surajmal – founder of Bharatpur Jaat state and key achievements.',a:`<div class="point"><span><strong>Surajmal</strong> = original founder of Jaat state of Bharatpur</span></div><div class="point"><span>Called <strong>'Pleto/Aflatun of Jaat'</strong> (Plato of Jaats)</span></div><div class="point"><span>Built lake palaces at Deeg → Deeg = <strong>'City of Lake Palaces'</strong></span></div><div class="point"><span>3rd Battle of Panipat (1761): gave shelter to retreating Maratha army at Bharatpur</span></div><div class="point"><span>Attacked Delhi; brought <strong>Noor Jahan's swing</strong>; installed at Deeg</span></div><div class="point"><span>Established <strong>Merit Based Bureaucracy</strong>; income: 1 crore 75 lakh</span></div>`,pyq:true,prob:false},
{id:12,topic:'jaat',topicLabel:'Jaat Dynasty – Bharatpur Fort',q:'Ranjit Singh (Bharatpur) and the Iron Fort.',a:`<div class="point"><span>Treaty with British 1803; gave shelter to Jaswant Rao Holkar during 2nd Anglo-Maratha War</span></div><div class="point"><span>Lord Lake attacked <strong>5 times</strong> but couldn't capture → <strong>Bharatpur Fort = 'Iron Fort'</strong></span></div><div class="point"><span>Built <strong>'Fateh Burj'</strong> in memory of victory</span></div><div class="point"><span><strong>Jawahar Singh</strong>: attacked Delhi; brought <strong>'Gate of 8 metals'</strong>; installed at Bharatpur Fort. Built <strong>Jawahar Burj</strong> (coronation site of kings)</span></div>`,pyq:true,prob:false},
{id:13,topic:'jaat',topicLabel:'Jaat Dynasty – Early Revolts',q:'Gokula and Raja Ram – early Jaat revolts against Aurangzeb.',a:`<div class="point"><span><strong>Gokula (1669)</strong>: revolted with Jaat farmers of Mathura against Aurangzeb; suppressed</span></div><div class="point"><span><strong>Raja Ram (1687)</strong>: revolted from Sinsini; <strong>looted Akbar's tomb at Sikandra</strong> and burnt his bones; suppressed</span></div><div class="point"><span><strong>Badan Singh</strong>: with help of Sawai Jai Singh became king of Deeg; built forts at Deeg, Vair, Kumher</span></div>`,pyq:false,prob:true}
];
let studied=new Set();
function renderCards(filter){
  const grid=document.getElementById('card-grid');grid.innerHTML='';
  const f=filter==='all'?cards:filter==='pyq'?cards.filter(c=>c.pyq):filter==='prob'?cards.filter(c=>c.prob):cards.filter(c=>c.topic===filter);
  if(!f.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">No cards.</div>';return}
  let last='';
  f.forEach(card=>{
    if(card.topicLabel!==last){const d=document.createElement('div');d.className='topic-divider';d.innerHTML=`<h2>${card.topicLabel}</h2><hr>`;grid.appendChild(d);last=card.topicLabel}
    const tall=card.a.length>400;const wrap=document.createElement('div');
    wrap.className=`card-wrap${tall?' tall':''}${studied.has(card.id)?' flipped':''}`;
    wrap.onclick=function(){this.classList.toggle('flipped');studied[this.classList.contains('flipped')?'add':'delete'](card.id);updateStats()};
    const b=`<div class="card-header"><span class="badge">${card.topicLabel}</span>${card.pyq?'<span class="badge badge-pyq">PYQ</span>':''}${card.prob?'<span class="badge badge-prob">HIGH-PROB</span>':''}</div>`;
    wrap.innerHTML=`<div class="card-inner"><div class="card-front">${b}<div class="question">${card.q}</div><div class="flip-hint">click to reveal ↓</div><span class="card-num">#${card.id}</span></div><div class="card-back">${b}<div class="answer-label">&gt; answer</div><div class="answer">${card.a}</div><span class="card-num">#${card.id}</span></div></div>`;
    grid.appendChild(wrap);
  });updateStats();
}
function filterCards(btn,filter){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCards(filter)}
function updateStats(){const t=cards.length,p=cards.filter(c=>c.pyq).length,pr=cards.filter(c=>c.prob).length;document.getElementById('total-count').textContent=t;document.getElementById('pyq-count').textContent=p;document.getElementById('prob-count').textContent=pr;document.getElementById('studied-count').textContent=studied.size;document.getElementById('progress-text').textContent=`> ${studied.size} / ${t} studied`;document.getElementById('progress-bar').style.width=(studied.size/t*100)+'%'}
window.addEventListener('scroll',()=>document.getElementById('scrollBtn').classList.toggle('visible',window.scrollY>300));
renderCards('all');
(function(){const c=document.getElementById('starfield'),ctx=c.getContext('2d');let W,H,stars=[],frame=0;function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}function init(){stars=[];const n=Math.min(180,Math.floor(W*H/8000));for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.1,speed:Math.random()*.2+.03,opacity:Math.random()*.5+.08,twinkle:Math.random()*Math.PI*2})}function draw(){ctx.clearRect(0,0,W,H);frame+=.008;stars.forEach(s=>{const a=s.opacity*(.75+.25*Math.sin(frame+s.twinkle));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(205,214,244,${a})`;ctx.fill();s.y+=s.speed;if(s.y>H+2){s.y=-2;s.x=Math.random()*W}});requestAnimationFrame(draw)}resize();init();draw();window.addEventListener('resize',()=>{resize();init()})})();
</script>
</body>
</html>
