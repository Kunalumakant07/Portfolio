<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAS Flashcards – Ancient History of Rajasthan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #070b0f;
    --surface:    #0d1117;
    --surface2:   #111820;
    --border:     #1a2633;
    --accent:     #00ff9f;
    --accent-dim: #00885a;
    --blue:       #7dd3fc;
    --amber:      #fbbf24;
    --purple:     #a78bfa;
    --text:       #cdd6f4;
    --muted:      #5b6b8a;
    --dim:        #131c27;
    --red:        #f87171;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* CRT scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* Starfield */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 28px 80px;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  header {
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .header-meta {
    font-size: 0.72rem;
    color: var(--accent-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  header h1 {
    font-family: 'VT323', monospace;
    font-size: 2.8rem;
    color: var(--text);
    letter-spacing: 4px;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 10px;
  }

  header h1 .hl { color: var(--accent); }

  header p {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ── STATS BAR ── */
  .stats {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 14px;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .stat-pill span { color: var(--accent); }

  /* ── PROGRESS ── */
  .progress-wrap {
    margin-bottom: 28px;
  }

  .progress-text {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .progress-bar-track {
    height: 2px;
    background: var(--border);
    max-width: 400px;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
    width: 0%;
  }

  /* ── FILTER BUTTONS ── */
  .filters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .filter-btn::before { content: '['; color: var(--dim); margin-right: 2px; }
  .filter-btn::after  { content: ']'; color: var(--dim); margin-left: 2px; }

  .filter-btn:hover { border-color: var(--accent-dim); color: var(--text); }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 700;
  }

  .filter-btn.active::before,
  .filter-btn.active::after { color: var(--accent-dim); }

  .filter-btn.pyq-filter.active  { background: var(--red);   border-color: var(--red);   color: var(--bg); }
  .filter-btn.prob-filter.active { background: var(--amber); border-color: var(--amber); color: var(--bg); }

  /* ── TOPIC DIVIDER ── */
  .topic-divider {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0 8px;
  }

  .topic-divider h2 {
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0.7;
  }

  .topic-divider hr {
    flex: 1;
    border: none;
    border-top: 1px solid var(--border);
  }

  /* ── CARD GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2px;
    max-width: 1100px;
  }

  /* ── FLASHCARD ── */
  .card-wrap {
    perspective: 1000px;
    height: 220px;
    cursor: pointer;
  }

  .card-wrap.tall { height: 280px; }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-wrap.flipped .card-inner { transform: rotateY(180deg); }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--surface);
    transition: border-color 0.2s;
  }

  /* left-bar hover — same as portfolio project cards */
  .card-front::before, .card-back::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 0%;
    background: var(--accent);
    transition: height 0.3s ease;
  }

  .card-wrap:hover .card-front::before,
  .card-wrap:hover .card-back::before { height: 100%; }

  .card-wrap:hover .card-front,
  .card-wrap:hover .card-back { border-color: var(--accent-dim); }

  .card-back {
    transform: rotateY(180deg);
    background: var(--surface2);
    justify-content: flex-start;
    overflow-y: auto;
  }

  /* ── BADGES ── */
  .card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 0.62rem;
    padding: 1px 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .badge-pyq  { border-color: rgba(241,113,113,0.4); color: var(--red); }
  .badge-prob { border-color: rgba(251,191,36,0.4);  color: var(--amber); }

  /* ── QUESTION ── */
  .question {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
    flex: 1;
    display: flex;
    align-items: center;
    letter-spacing: 0.3px;
  }

  .flip-hint {
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* ── ANSWER ── */
  .answer-label {
    font-size: 0.65rem;
    color: var(--accent-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  .answer {
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--muted);
  }

  .answer strong { color: var(--amber); }

  .answer .point {
    display: flex;
    gap: 6px;
    margin-bottom: 3px;
  }

  .answer .point::before {
    content: "›";
    color: var(--accent-dim);
    flex-shrink: 0;
  }

  /* card number */
  .card-num {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 0.6rem;
    color: var(--border);
    letter-spacing: 1px;
  }

  /* ── SCROLL TOP ── */
  #scrollBtn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 38px;
    height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    transition: all 0.2s;
    font-size: 1rem;
  }

  #scrollBtn:hover { border-color: var(--accent-dim); color: var(--accent); }
  #scrollBtn.visible { display: flex; }

  @media (max-width: 680px) {
    .wrap { padding: 0 16px 60px; }
    header h1 { font-size: 2rem; letter-spacing: 2px; }
    .grid { grid-template-columns: 1fr; }
    .card-wrap, .card-wrap.tall { height: auto; min-height: 220px; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="wrap">

<header>
  <div class="header-meta">&gt; ras_prep // rajasthan_history.init()</div>
  <h1>Ancient History<br><span class="hl">Flashcards</span></h1>
  <p>Rajasthan History (English) 2024 &nbsp;·&nbsp; Click any card to flip &nbsp;·&nbsp; <a href="../index.html" style="color:var(--accent-dim);text-decoration:none">← back to portfolio</a></p>
</header>

<div class="stats">
  <div class="stat-pill">total <span id="total-count">0</span></div>
  <div class="stat-pill">pyq <span id="pyq-count">0</span></div>
  <div class="stat-pill">high-prob <span id="prob-count">0</span></div>
  <div class="stat-pill">studied <span id="studied-count">0</span></div>
</div>

<div class="progress-wrap">
  <div class="progress-text" id="progress-text">&gt; 0 / 0 studied</div>
  <div class="progress-bar-track"><div class="progress-bar" id="progress-bar"></div></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterCards('all')">All</button>
  <button class="filter-btn pyq-filter" onclick="filterCards('pyq')">PYQ</button>
  <button class="filter-btn prob-filter" onclick="filterCards('prob')">High Prob</button>
  <button class="filter-btn" onclick="filterCards('stone')">Stone Age</button>
  <button class="filter-btn" onclick="filterCards('chalco')">Chalcolithic</button>
  <button class="filter-btn" onclick="filterCards('bronze')">Bronze Age</button>
  <button class="filter-btn" onclick="filterCards('iron')">Iron Age</button>
  <button class="filter-btn" onclick="filterCards('janpad')">Mahajanpad</button>
  <button class="filter-btn" onclick="filterCards('maurya')">Mauryan</button>
  <button class="filter-btn" onclick="filterCards('postmaurya')">Post-Mauryan</button>
  <button class="filter-btn" onclick="filterCards('gupta')">Gupta</button>
  <button class="filter-btn" onclick="filterCards('postgupta')">Post-Gupta</button>
  <button class="filter-btn" onclick="filterCards('sites')">Other Sites</button>
  <button class="filter-btn" onclick="filterCards('misc')">Coins & Rock Art</button>
  <button class="filter-btn" onclick="filterCards('mustknow')">Must-Know</button>
</div>

<div class="grid" id="card-grid"></div>

</div><!-- /wrap -->

<button id="scrollBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const cards = [

// ══════════════ STONE AGE ══════════════
{id:1, topic:'stone', topicLabel:'Stone Age', q:'Who is known as the "Father of Archaeology of India" and the "Father of Archaeology of Rajasthan"?', a:`<div class="point"><span>Father of Archaeology of <strong>India</strong> → <strong>Alexander Cunningham</strong></span></div><div class="point"><span>Father of Archaeology of <strong>Rajasthan</strong> → <strong>Archibald Campbell</strong></span></div>`, pyq:true, prob:false},
{id:2, topic:'stone', topicLabel:'Stone Age', q:'What is Bagore famous for? Who excavated it and where is it located?', a:`<div class="point"><span>Located near <strong>Kothari River</strong>; site called <strong>Mhasatiya</strong></span></div><div class="point"><span>Excavator: <strong>Virendra Nath Mishra</strong> (Pune University)</span></div><div class="point"><span>Known as <strong>"Cradle of Ancient Civilisation of Rajasthan"</strong></span></div><div class="point"><span>Evidences: Microlith, Agriculture, Domestication of Animals, Copper needle with hole, Iron equipment</span></div>`, pyq:true, prob:false},
{id:3, topic:'stone', topicLabel:'Stone Age', q:'Bagore is called the "Cradle of Ancient Civilisation of Rajasthan." Who discovered it? What age does it belong to?', a:`<div class="point"><span>Discovered by <strong>L.S. Leshni</strong>; excavated by <strong>Virendra Nath Mishra</strong></span></div><div class="point"><span>Belongs to <strong>Mesolithic Age</strong></span></div><div class="point"><span>Book by Mishra: <em>Bagore & Tilwara – Late Mesolithic Cultures of North West India</em></span></div>`, pyq:true, prob:false},
{id:4, topic:'stone', topicLabel:'Stone Age', q:'Match the Stone Age sites with their locations: Tilwara, Pachpadra, Jayal, Deedwana, Sojat, Dhaneri', a:`<div class="point"><span><strong>Tilwara</strong> – near Luni River (Balotra)</span></div><div class="point"><span><strong>Pachpadra</strong> – Balotra</span></div><div class="point"><span><strong>Jayal</strong> – Nagore</span></div><div class="point"><span><strong>Deedwana</strong> – Nagore</span></div><div class="point"><span><strong>Sojat</strong> – Pali</span></div><div class="point"><span><strong>Dhaneri</strong> – Pali</span></div>`, pyq:false, prob:true},
{id:5, topic:'stone', topicLabel:'Stone Age', q:'Name the three sub-divisions of the Stone Age and their key Rajasthan sites.', a:`<div class="point"><span><strong>Palaeolithic</strong>: Deedwana, Jayal, Budha Pushkar, Bhangarh</span></div><div class="point"><span><strong>Mesolithic</strong>: Bagore, Tilwara, Pachpadra, Dhaneri, Sojat</span></div><div class="point"><span><strong>Neolithic</strong>: (transition to Chalcolithic)</span></div><div class="point"><span>In 1870 AD, <strong>C.A. Hacket</strong> found 'hand axe' from Jaipur & Indergarh</span></div>`, pyq:false, prob:true},
{id:6, topic:'stone', topicLabel:'Stone Age', q:'Virendra Nath Mishra excavated both Bagore and Tilwara. What was his famous book?', a:`<div class="point"><span><em><strong>"Bagore & Tilwara – Late Mesolithic Cultures of North West India"</strong></em></span></div><div class="point"><span>Both sites belong to <strong>Mesolithic Age</strong></span></div><div class="point"><span>Tilwara is located near <strong>Luni River, Balotra</strong></span></div>`, pyq:false, prob:true},

// ══════════════ CHALCOLITHIC ══════════════
{id:7, topic:'chalco', topicLabel:'Chalcolithic Age', q:'Why is the Chalcolithic Age civilization of Rajasthan also called "Banas Civilization"? What is its most prominent site?', a:`<div class="point"><span>Most sites are located near <strong>River Banas</strong> → called <strong>Banas Civilization</strong></span></div><div class="point"><span>Most prominent site: <strong>Ahar (Udaipur)</strong></span></div><div class="point"><span>Also called <strong>Ahar Civilization</strong></span></div>`, pyq:true, prob:false},
{id:8, topic:'chalco', topicLabel:'Chalcolithic Age', q:'Describe Ahar (Udaipur) — ancient names, local name, location, and excavators.', a:`<div class="point"><span>Located near river <strong>Bedach / Ayad</strong></span></div><div class="point"><span>Ancient names: <strong>Aghatpur & Atapur</strong></span></div><div class="point"><span>Local name: <strong>Dhoolkot</strong></span></div><div class="point"><span>Excavators: <strong>Akshay Kirti Vyas, Ratan Chandra Agrawal, H.D. Sankaliya</strong> (longest period)</span></div><div class="point"><span>Known as <strong>'Copper City'</strong> (copper furnaces found)</span></div>`, pyq:true, prob:false},
{id:9, topic:'chalco', topicLabel:'Chalcolithic Age', q:'List key evidences found at Ahar that make it internationally significant.', a:`<div class="point"><span><strong>Copper furnaces</strong> → "Copper City"</span></div><div class="point"><span><strong>Lapis Lazuli</strong> (blue stone) from Afghanistan</span></div><div class="point"><span><strong>Coin with Apollo paintings</strong> from Greece</span></div><div class="point"><span><strong>Without-handle water pot</strong> from Iran</span></div><div class="point"><span><strong>Six stoves</strong> → evidence of joint family</span></div><div class="point"><span><strong>Bull Terracotta</strong> → "Banasian Bull"</span></div><div class="point"><span>Black & Red earthenwares called <strong>Gore & Kothe</strong></span></div>`, pyq:true, prob:false},
{id:10, topic:'chalco', topicLabel:'Chalcolithic Age', q:'What is Ganeshwar known as? Where is it and who excavated it?', a:`<div class="point"><span>Located near <strong>Kantali River, Neem ka Thana</strong></span></div><div class="point"><span>Excavator: <strong>Ratan Chandra Agrawal</strong></span></div><div class="point"><span>Known as <strong>"Mother of Copper Age Civilization"</strong> and <strong>"Copper Hoard Civilization"</strong></span></div><div class="point"><span>Copper was sent to <strong>Harappa & Mohenjodaro</strong> from here</span></div>`, pyq:true, prob:false},
{id:11, topic:'chalco', topicLabel:'Chalcolithic Age', q:'Describe Gilund and Balathal — their locations and excavators.', a:`<div class="point"><span><strong>Gilund</strong> – Rajsamand; site called <strong>'Modiya Magri'</strong>; excavators: B.B. Lal, V.S. Shinde, Gregory Poshal</span></div><div class="point"><span>Evidence: Baked Bricks, 5 types of earthenware, Terracotta toys</span></div><div class="point"><span><strong>Balathal</strong> – Udaipur; excavator: <strong>Virendra Nath Mishra</strong></span></div><div class="point"><span>Connected with <strong>Indus Valley Civilization</strong>; house with 11 rooms found</span></div>`, pyq:false, prob:true},
{id:12, topic:'chalco', topicLabel:'Chalcolithic Age', q:'What were the evidences found at Ojhiyana (Bhilwara)? Who excavated it?', a:`<div class="point"><span>Located near <strong>Khari River, Bhilwara</strong></span></div><div class="point"><span>Excavators: <strong>B.R. Meena & Alok Tripathi</strong></span></div><div class="point"><span>Evidences: <strong>Cow & Bull Terracottas</strong></span></div>`, pyq:false, prob:true},

// ══════════════ BRONZE AGE ══════════════
{id:13, topic:'bronze', topicLabel:'Bronze Age', q:'Kalibanga (Hanumangarh) — literal meaning, river, and who first gave information?', a:`<div class="point"><span>Literal meaning: <strong>"Black Bangles"</strong></span></div><div class="point"><span>Located near <strong>Ghaggar River</strong></span></div><div class="point"><span>First information given by <strong>L.P. Tessitory</strong></span></div><div class="point"><span>Discovered in 1952 by <strong>Amlanand Ghosh</strong></span></div><div class="point"><span>Museum established in <strong>1985 AD</strong></span></div>`, pyq:true, prob:false},
{id:14, topic:'bronze', topicLabel:'Bronze Age', q:'List the excavators of Kalibanga and the number of excavation stages found.', a:`<div class="point"><span>Excavators: <strong>B.B. Lal, B.K. Thappar, M.D. Khare, K.M. Shrivastav, S.P. Jain</strong></span></div><div class="point"><span><strong>5 stages</strong> excavated (1900–2600 B.C.)</span></div><div class="point"><span>According to Dashrath Sharma → Kalibanga was <strong>3rd capital of Harappan Civilization</strong></span></div><div class="point"><span>Pre-Harappan + Developed Harappan stages both found</span></div>`, pyq:true, prob:false},
{id:15, topic:'bronze', topicLabel:'Bronze Age', q:'What unique/special evidences were found at Kalibanga that are not found anywhere else?', a:`<div class="point"><span><strong>7 Fire Altars</strong> (unique to Kalibanga)</span></div><div class="point"><span><strong>Ploughed farm field</strong> (South-East direction) – earliest evidence</span></div><div class="point"><span><strong>Two crops grown simultaneously</strong> (wheat & barley)</span></div><div class="point"><span><strong>Skull with 6 holes</strong> → evidence of brain surgery</span></div><div class="point"><span><strong>Couple burials</strong> found</span></div><div class="point"><span><strong>Cylindrical seal</strong> → Mesopotamian connection</span></div><div class="point"><span><strong>Earthquake evidences</strong></span></div>`, pyq:true, prob:false},
{id:16, topic:'bronze', topicLabel:'Bronze Age', q:'Kalibanga\'s town planning — how was the town divided?', a:`<div class="point"><span>Town divided into <strong>2 parts</strong>:</span></div><div class="point"><span><strong>Western Part (Higher elevation)</strong> → Citadel (Administrative buildings)</span></div><div class="point"><span><strong>Eastern Part (Lower elevation)</strong> → Lower Town (General buildings)</span></div><div class="point"><span>Roads intersected at <strong>right angles</strong></span></div><div class="point"><span>Doors of houses did NOT open on main road</span></div><div class="point"><span>Both sections surrounded by separate security ramparts</span></div>`, pyq:true, prob:false},
{id:17, topic:'bronze', topicLabel:'Bronze Age', q:'What is Sothi Civilization? Name its two major centers.', a:`<div class="point"><span>Civilization around <strong>Bikaner</strong> area</span></div><div class="point"><span>Called <strong>Sothi Civilization</strong> or <strong>Kalibanga I</strong></span></div><div class="point"><span><strong>Amlanand Ghosh</strong> called it the origin place of Harappan civilization</span></div><div class="point"><span>Two centers: <strong>1. Savaniya  2. Pugal</strong></span></div>`, pyq:false, prob:true},
{id:18, topic:'bronze', topicLabel:'Bronze Age', q:'Who conducted the survey of River Ghaggar related to Kalibanga? What was the book written?', a:`<div class="point"><span><strong>Aurel Stein</strong> conducted survey of river Ghaggar</span></div><div class="point"><span>Stein's book: <em><strong>"A Survey Work of Ancient Sites along Lost Saraswati River"</strong></em></span></div><div class="point"><span>Three names: Indus Valley Civilization / Harappan Civilization / <strong>Indus-Saraswati Civilization</strong></span></div>`, pyq:false, prob:true},

// ══════════════ IRON AGE ══════════════
{id:19, topic:'iron', topicLabel:'Iron Age', q:'Which age is known as Vedic Civilization and why? Name its centers in Rajasthan.', a:`<div class="point"><span>Iron Age is called <strong>Vedic Civilization</strong> because Vedas provide its information</span></div><div class="point"><span>Centers in Rajasthan: <strong>Anupgarh, Tarkhanwala Dera, Chak-64</strong></span></div>`, pyq:false, prob:true},

// Render all cards
let studied = new Set();
let currentFilter = 'all';

function renderCards(filter) {
  currentFilter = filter;
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  const filtered = filter === 'all' ? cards :
    filter === 'pyq' ? cards.filter(c => c.pyq) :
    filter === 'prob' ? cards.filter(c => c.prob) :
    cards.filter(c => c.topic === filter);

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">No cards in this category.</div>';
    return;
  }

  // Group by topic
  let lastTopic = '';
  filtered.forEach(card => {
    if (card.topicLabel !== lastTopic) {
      const div = document.createElement('div');
      div.className = 'topic-divider';
      div.innerHTML = `<h2>${card.topicLabel}</h2><hr>`;
      grid.appendChild(div);
      lastTopic = card.topicLabel;
    }

    const tall = card.a.length > 400;
    const wrap = document.createElement('div');
    wrap.className = `card-wrap ${tall ? 'tall' : ''} ${studied.has(card.id) ? 'flipped' : ''}`;
    wrap.dataset.id = card.id;
    wrap.onclick = function() {
      this.classList.toggle('flipped');
      if (this.classList.contains('flipped')) {
        studied.add(card.id);
      } else {
        studied.delete(card.id);
      }
      updateStats();
    };

    const badges = `
      <div class="card-header">
        <span class="badge badge-topic">${card.topicLabel}</span>
        ${card.pyq ? '<span class="badge badge-pyq">PYQ</span>' : ''}
        ${card.prob ? '<span class="badge badge-prob">HIGH-PROB</span>' : ''}
      </div>`;

    wrap.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          ${badges}
          <div class="question">${card.q}</div>
          <div class="flip-hint">Click to reveal answer ↓</div>
          <span class="card-num">#${card.id}</span>
        </div>
        <div class="card-back">
          ${badges}
          <div class="answer-label">&gt; answer</div>
          <div class="answer">${card.a}</div>
          <span class="card-num">#${card.id}</span>
        </div>
      </div>`;
    grid.appendChild(wrap);
  });
  updateStats();
}

function filterCards(filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  const map = {'all':0,'pyq':1,'prob':2,'stone':3,'chalco':4,'bronze':5,'iron':6,'janpad':7,'maurya':8,'postmaurya':9,'gupta':10,'postgupta':11,'sites':12,'misc':13,'mustknow':14};
  document.querySelectorAll('.filter-btn')[map[filter]].classList.add('active');
  renderCards(filter);
}

function updateStats() {
  const total = cards.length;
  const pyq = cards.filter(c=>c.pyq).length;
  const prob = cards.filter(c=>c.prob).length;
  document.getElementById('total-count').textContent = total;
  document.getElementById('pyq-count').textContent = pyq;
  document.getElementById('prob-count').textContent = prob;
  document.getElementById('studied-count').textContent = studied.size;
  document.getElementById('progress-text').textContent = `> ${studied.size} / ${total} studied`;
  document.getElementById('progress-bar').style.width = (studied.size/total*100)+'%';
}

// Scroll button
window.addEventListener('scroll', () => {
  document.getElementById('scrollBtn').classList.toggle('visible', window.scrollY > 300);
});

renderCards('all');

// Starfield
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function init() {
    stars = [];
    const n = Math.min(180, Math.floor(W * H / 8000));
    for (let i = 0; i < n; i++) stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.1+0.1, speed: Math.random()*0.2+0.03,
      opacity: Math.random()*0.5+0.08, twinkle: Math.random()*Math.PI*2
    });
  }
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,W,H);
    frame += 0.008;
    stars.forEach(s => {
      const a = s.opacity*(0.75+0.25*Math.sin(frame+s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(205,214,244,${a})`;
      ctx.fill();
      s.y += s.speed;
      if (s.y > H+2) { s.y = -2; s.x = Math.random()*W; }
    });
    requestAnimationFrame(draw);
  }
  resize(); init(); draw();
  window.addEventListener('resize', () => { resize(); init(); });
})();
</script>
</body>
</html>
